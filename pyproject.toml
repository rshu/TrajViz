[build-system]
# 1.27 is the first hatchling with PEP 639 license metadata.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-trajviz"
# Single source: agent_trajviz/__init__.py (see [tool.hatch.version]).
dynamic = ["version"]
description = "Parse and analyze LLM agent trajectories (Claude Code, Cursor, OpenCode, CodeArts, ICode, Codex CLI, Pi, DeepSeek Harness): every metric and chart as JSON, with optional figures and dashboards"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Rui Shu" }]
keywords = ["llm", "agent", "coding-agent", "trajectory", "observability", "visualization", "analytics",
            "claude-code", "codex", "opencode", "cursor", "gradio", "plotly"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# The core (loading, parsing, metrics, context usage, patterns, comparison and
# the collection tools) uses only the standard library; features that need
# third-party packages are extras.
dependencies = []

[project.optional-dependencies]
# Lower bounds are the oldest releases the suite passes with (CI installs them
# with `--resolution lowest-direct`), except requests, which is held at the
# release that fixed a .netrc credential leak (CVE-2024-47081).
# Figures and the static HTML report.
charts = ["plotly>=5.15", "pygments>=2.13"]
# LLM features: the AI analysis sidebar, the Issues judge and the step labeler.
llm = ["requests>=2.32.4"]
# The Insight and Converge dashboards, with charts and LLM features.
app = ["agent-trajviz[charts,llm]", "gradio>=6.14.0"]
# Compressed native session logs use the standard library on Python 3.14+.
zstd = ["zstandard>=0.23; python_version < '3.14'"]
# Everything a user can install.
all = ["agent-trajviz[app,zstd]"]
# Development: the full feature set plus the test and lint tools. CI installs it
# with `uv sync --locked --extra dev`, so an undeclared test import is a
# collection error there, not a skip.
dev = [
    "agent-trajviz[all]",
    "pytest>=8.0",
    "ruff>=0.16",
    "hypothesis>=6.100",
    # Validates every view against its shipped JSON Schema.
    "jsonschema>=4.18",
]

[project.scripts]
# Every command carries the distribution's prefix. The Converge dashboard has
# no script of its own: `python -m agent_trajviz.converge` launches it.
agent-trajviz = "agent_trajviz.insight.__main__:main"
agent-trajviz-converge = "agent_trajviz.converge.cli:main"
agent-trajviz-collect = "agent_trajviz.collect.__main__:main"
agent-trajviz-label = "agent_trajviz.labeling.labeler:main"
agent-trajviz-awe = "agent_trajviz.awe.__main__:main"

[project.urls]
Homepage = "https://github.com/rshu/TrajViz"
Documentation = "https://rshu.github.io/TrajViz/"
Repository = "https://github.com/rshu/TrajViz"
Issues = "https://github.com/rshu/TrajViz/issues"
Changelog = "https://github.com/rshu/TrajViz/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "agent_trajviz/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["agent_trajviz"]

# The sdist carries what is needed to build and read the package, not the
# test suite: its fixtures include recorded agent runs.
[tool.hatch.build.targets.sdist]
include = ["/agent_trajviz", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = [
    # Long lines inside HTML/CSS/JS template strings dominate the UI modules;
    # E501 stays advisory there. Code lines are kept within 120 by review.
    "E501",
    # Nested if/with collapses and ternary rewrites often hurt readability in
    # the step-normalization code; applied case-by-case instead of enforced.
    "SIM102", "SIM105", "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
# The evaluator uses compact mathematical expressions and validation predicates.
# Rule registration also uses delayed imports to avoid dependency cycles.
# Keep these forms while retaining correctness and late-binding lint checks.
"agent_trajviz/awe/_engine/**/*.py" = ["B007", "E741", "E731", "UP031", "SIM103", "SIM113", "E402"]
"agent_trajviz/awe/_engine/scripts/*.py" = ["E402"]

# The presence of this table is load-bearing, independent of its contents: it
# makes THIS file pytest's inifile, which pins rootdir to this repository. A
# checkout nested inside another project whose pyproject.toml carries
# [tool.pytest.ini_options] would otherwise have pytest walk up, resolve rootdir
# to that parent and inherit its settings (unknown plugin options become
# warnings, and a bare `pytest` collects the parent's `testpaths` instead of
# ours).
#
# `pythonpath` puts the repository root on sys.path, so the suite imports the
# package from this checkout whether or not it is installed, from any CWD.
# No `addopts`: it would change CI log shape for no gain.
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
# CI checks the six public modules explicitly under --strict. Follow internal
# implementation imports for their types without checking those modules as
# additional strict targets.
follow_imports = "silent"
