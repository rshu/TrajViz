name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "refactor/**", "rename/**"]
  pull_request:

permissions:
  contents: read

# One uv for every job: the lockfile format is uv's, so an unpinned uv can
# reject a lock that the pinned one wrote. Bump it together with `uv lock`.
env:
  UV_VERSION: "0.11.28"

jobs:
  # Every supported Python tests native parsing and the bundled evaluator.
  # No external source checkout or private repository credentials are needed.
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: Lint (ruff)
        if: matrix.python == '3.13'
        run: uv run --locked ruff check agent_trajviz tests examples .github/scripts
      # No PYTHONPATH: `pythonpath = ["."]` in [tool.pytest.ini_options] puts
      # the repo root on sys.path and pins rootdir to this repository.
      - name: Test
        run: uv run --locked python -m pytest tests -q

  # The package declares "OS Independent". The suite also runs on macOS; on
  # Windows the public API runs from the installed wheel (no extras), since a
  # few of the suite's own fixtures assume a POSIX file system.
  other-os:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Test (locked)
        if: runner.os == 'macOS'
        run: |
          uv sync --locked --extra dev
          uv run --locked python -m pytest tests -q
      - name: Build the wheel
        run: uv build --wheel
      - name: Public API from the installed wheel (no extras)
        run: uv run --no-project --isolated --with "$(ls dist/*.whl)" python .github/scripts/smoke_core.py
      - name: Bundled evaluation from the installed wheel (no extras)
        run: >-
          uv run --no-project --isolated --with "$(ls dist/*.whl)" python -I
          .github/scripts/check_evaluation_install.py

  # The declared lower bounds are real: install the oldest allowed release of
  # every direct dependency, on the oldest and newest supported Python.
  lowest-deps:
    name: lowest dependencies (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install (lowest direct versions)
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install --resolution lowest-direct ".[dev]"
      - name: Test
        run: .venv/bin/python -m pytest tests -q

  # The public API (the names exported from agent_trajviz) is typed and must
  # stay clean under --strict.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: mypy --strict (public API)
        run: >
          uv run --locked --with "mypy>=1.13" mypy --strict
          agent_trajviz/__init__.py agent_trajviz/api.py agent_trajviz/errors.py agent_trajviz/model.py
          agent_trajviz/views.py agent_trajviz/plugins.py

  # What a user installs: build the sdist and wheel, check their metadata, and
  # install the wheel into clean environments -- the core alone must pull in
  # no third-party package, and the app extra must run every entry point.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - name: Core install (no extras)
        run: |
          uv venv --python 3.11 /tmp/core
          uv pip install --python /tmp/core/bin/python dist/*.whl
          /tmp/core/bin/python - <<'PY'
          import importlib.metadata as md
          names = sorted(d.metadata["Name"] for d in md.distributions())
          assert names == ["agent-trajviz"], names
          import agent_trajviz as tv
          run = tv.load("tests/fixtures/codearts_minimal.json")
          assert run.steps and run.metrics["tokens"]["total"] > 0
          # The view schemas are package data: every view must find its own.
          schemas = tv.view_schemas()
          assert set(tv.VIEW_CATALOG) <= set(schemas) and len(schemas) > len(tv.VIEW_CATALOG), len(schemas)
          PY
          /tmp/core/bin/agent-trajviz --version
          # Without the app extra the dashboard must refuse with exit 2 and a hint.
          status=0; /tmp/core/bin/agent-trajviz 2>/tmp/err.txt || status=$?
          test "$status" -eq 2 && grep -q 'agent-trajviz\[app\]' /tmp/err.txt
      - name: App install
        run: |
          uv venv --python 3.13 /tmp/app
          uv pip install --python /tmp/app/bin/python "agent-trajviz[app] @ file://$(ls "$PWD"/dist/*.whl)"
          /tmp/app/bin/agent-trajviz --report tests/fixtures/codearts_minimal.json -o /tmp/report.html
          test -s /tmp/report.html
          /tmp/app/bin/agent-trajviz-converge tests/fixtures/codearts_minimal.json tests/fixtures/codearts_minimal.json > /dev/null
          /tmp/app/bin/agent-trajviz-collect --version
          /tmp/app/bin/agent-trajviz-label --version
          /tmp/app/bin/python -c "from agent_trajviz.insight.insight import build_ui; build_ui()"
          /tmp/app/bin/python -c "from agent_trajviz.converge.app import build_ui; build_ui()"

  # The API reference, built from the docstrings of the public modules. It is
  # validated on every change; trusted publication follows successful main CI.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: Build documentation and run examples
        run: >
          uv run --locked --with pdoc==16.0.0 python .github/scripts/build_docs.py
          --package-root . --output site --version-label development --check-examples
      - name: Test documentation tooling
        run: >
          uv run --locked --with pdoc==16.0.0 python -m pytest -q
          tests/test_docs_build.py tests/test_docs_examples.py tests/test_docs_archive.py tests/test_docs_source.py
      - name: Upload the API reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-reference
          path: site/
          retention-days: 14

  # Coverage is reported, not assumed. Separate job so a coverage dip reads
  # differently from a test failure.
  #
  # Coverage includes the complete bundled evaluator. The threshold protects
  # against losing exercised behavior as either subsystem grows.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install (locked)
        run: uv sync --locked --extra dev
      # `uv run --with` layers coverage over the locked environment instead of
      # adding it to the dev extra, so the lock stays the single source of what
      # is installed. The settings live on the command line so the log states
      # exactly what was measured.
      - name: Measure coverage (including bundled evaluation)
        run: >
          uv run --locked --with "coverage>=7.16" coverage run
          --branch --source=agent_trajviz -m pytest tests -q
      - name: Report coverage
        run: |
          uv run --locked --with "coverage>=7.16" coverage report --precision=1 --show-missing --fail-under=80
          uv run --locked --with "coverage>=7.16" coverage html
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14
