name: Evaluation integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.28'
      - name: Build the standalone wheel
        run: uv build --wheel
      - name: Install the wheel without extras
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/evaluation-wheel"
          uv pip install --python "$RUNNER_TEMP/evaluation-wheel/bin/python" dist/*.whl
      - name: Validate bundled resources and offline operations
        run: >-
          "$RUNNER_TEMP/evaluation-wheel/bin/python" -I
          .github/scripts/check_evaluation_install.py
