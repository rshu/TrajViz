name: Release

# Publishes to PyPI when a version tag (v0.1.0, ...) is pushed. Uses PyPI
# Trusted Publishing: no API token is stored anywhere. One-time setup on PyPI:
# add a trusted publisher for this repository, workflow `release.yml`,
# environment `pypi`; on GitHub, create the `pypi` environment (ideally with a
# required reviewer).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  UV_VERSION: "0.11.28"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' agent_trajviz/__init__.py)
          echo "package $version, tag $GITHUB_REF_NAME"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Test (locked)
        run: |
          uv sync --locked --extra dev
          uv run --locked python -m pytest tests -q
      - name: Build
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-trajviz
    permissions:
      id-token: write # Trusted Publishing; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
